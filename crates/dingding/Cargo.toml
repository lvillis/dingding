[package]
name = "dingding"
description = "DingTalk SDK and bot framework for Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "Cargo.toml",
    "src/**",
    "tests/fixtures/tls/**",
]

[features]
default = ["async-tls-rustls-ring", "webhook", "openapi", "bot", "stream", "macros"]
async-tls-rustls-ring = ["reqx/async-tls-rustls-ring", "dep:rustls", "rustls/ring", "dep:webpki-roots", "tokio-tungstenite?/rustls-tls-webpki-roots"]
async-tls-rustls-aws-lc-rs = ["reqx/async-tls-rustls-aws-lc-rs", "dep:rustls", "rustls/aws_lc_rs", "dep:webpki-roots", "tokio-tungstenite?/rustls-tls-webpki-roots"]
async-tls-rustls-graviola = ["reqx/async-tls-rustls-graviola", "dep:rustls", "dep:rustls-graviola", "dep:webpki-roots", "tokio-tungstenite?/rustls-tls-webpki-roots"]
async-tls-native = ["reqx/async-tls-native", "dep:native-tls", "tokio-tungstenite?/native-tls"]
webhook = []
openapi = ["dep:tokio", "tokio/fs", "tokio/io-util", "tokio/time", "dep:getrandom"]
bot = ["webhook"]
stream = ["openapi", "bot", "dep:futures-util", "dep:tokio", "tokio/macros", "tokio/rt", "tokio/time", "dep:tokio-tungstenite", "dep:tracing"]
macros = ["bot", "dep:dingding-macros"]

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true }
httpdate = { workspace = true }
reqx = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
dingding-macros = { version = "0.1.8", path = "../dingding-macros", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "test-util"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
no-default-features = true
features = ["async-tls-rustls-ring", "webhook", "openapi", "bot", "stream", "macros"]
