[workspace]
members = [
    "crates/dingding",
    "crates/dingding-macros",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/lvillis/dingding"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

reqx = { version = "0.2.7", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
urlencoding = { version = "2.1.3", default-features = false }

futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
trybuild = { version = "1.0.121", default-features = false }

proc-macro-crate = { version = "3.5.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3.0.6", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.metadata.release]
allow-branch = ["main"]
publish = false
shared-version = true
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
tag-message = "chore: release version {{version}}"
pre-release-commit-message = "chore: release version {{version}}"
pre-release-hook = ["git", "cliff", "--workdir", "../../", "--output", "../../CHANGELOG.md", "--tag", "{{version}}"]
